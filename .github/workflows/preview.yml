# Deploys each pull request to its own Cloudflare Worker Preview and comments the URL.
# Previews are noindex and use Turnstile test keys, placeholder contact details and email dry-run.
name: Preview on Cloudflare

on:
    pull_request:
        types: [opened, synchronize, reopened, closed]

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: preview-${{ github.event.pull_request.number }}
    cancel-in-progress: true

env:
    PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
    CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
    preview:
        if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - run: npm run build
              env:
                  NUXT_SITE_URL: ${{ vars.NUXT_SITE_URL }}
                  NUXT_SITE_ENV: preview
                  NUXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

            - id: deploy
              run: |
                  output=$(npx wrangler preview --name "$PREVIEW_NAME" --json \
                      --var NUXT_TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA \
                      --var NUXT_RESEND_DRY_RUN:true \
                      --var "NUXT_CONTACT_PHONE:+39 000 000 0000" \
                      --var NUXT_CONTACT_EMAIL:preview@example.com)
                  echo "$output"
                  # Pick the URL out of the output rather than relying on the beta JSON shape.
                  url=$(echo "$output" | grep -oE 'https://[^"[:space:]]+workers\.dev[^"[:space:]]*' | head -1)
                  echo "url=$url" >> "$GITHUB_OUTPUT"

            - if: steps.deploy.outputs.url != ''
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR: ${{ github.event.pull_request.number }}
                  URL: ${{ steps.deploy.outputs.url }}
              run: |
                  body="Preview deployed: $URL (commit ${GITHUB_SHA::7}, noindex, test captcha)"
                  gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body" --edit-last --create-if-none

    cleanup:
        if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci --ignore-scripts

            - run: npx wrangler preview delete --name "$PREVIEW_NAME" --worker-name ramaj-portfolio --skip-confirmation
